name: Validate and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  AWS_ACCOUNT_ID: "187489282488"
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::187489282488:role/MoodleMCPGitHubDeploymentRole
  ECR_REPOSITORY: moodle-mcp
  SAM_ARTIFACT_BUCKET: aws-sam-cli-managed-default-samclisourcebucket-wamv9ffcwtfw
  STACK_NAME: moodle-mcp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Test
        run: go test ./... -count=1

      - name: Validate SAM templates
        run: |
          sam validate --lint --template-file template.yaml
          sam validate --lint --template-file infrastructure/bootstrap.yaml

      - name: Build Lambda image
        run: |
          for attempt in 1 2 3 4 5; do
            docker buildx build \
              --platform linux/arm64 \
              --file Dockerfile.lambda \
              --build-arg VERSION="$GITHUB_SHA" \
              --tag moodle-mcp:validate \
              --load \
              --provenance=false \
              --sbom=false \
              . && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: moodle-mcp-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: moodle-mcp-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and publish Lambda image
        id: image
        run: |
          image_repository="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          for attempt in 1 2 3 4 5; do
            if docker buildx build \
              --platform linux/arm64 \
              --file Dockerfile.lambda \
              --build-arg VERSION="$GITHUB_SHA" \
              --tag "$image_repository:$GITHUB_SHA" \
              --push \
              --provenance=false \
              --sbom=false \
              .; then
              image_digest=$(aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="$GITHUB_SHA" \
                --query 'imageDetails[0].imageDigest' \
                --output text)
              echo "uri=$image_repository@$image_digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Deploy to Lambda
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --parameter-overrides "LambdaImageUri=${{ steps.image.outputs.uri }}" MoodleSecretName=moodle-mcp \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --on-failure ROLLBACK \
            --no-progressbar
